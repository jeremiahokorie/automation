name: Deploy Process Automation App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Jar
      run: mvn clean package -DskipTests

    - name: Publish to GitHub Packages
      run: |
        mvn deploy
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

    - name: SSH into VPS and Deploy
      env:
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_KEY: ${{ secrets.VPS_KEY }}
        APP_DIR: /opt/myapp
      run: |
        echo "$VPS_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "mkdir -p $APP_DIR"
        scp target/*.jar $VPS_USER@$VPS_HOST:$APP_DIR/myapp.jar
        ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo systemctl restart myapp"
